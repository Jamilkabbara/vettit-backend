# Pass 37 A10 — post-merge deploy verification.
#
# Doctrine #17 (Pass 37): "Shipped" = deployed in production, NOT merged
# to main. Pass 36 was reported "shipped" with 14 commits but live
# /version still returned pass:35 — Railway never auto-deployed and
# nobody noticed until the next pass's audit.
#
# This workflow runs on every merge to main and verifies that the live
# /version endpoint reports the same `pass` number as the freshly-merged
# code in src/app.js. If the numbers don't match within DEPLOY_WAIT_S,
# the run fails and emits an explicit "deploy did not propagate"
# message, which surfaces in GitHub's commit-status indicator so we
# catch silent deploy failures immediately.

name: Verify Deploy

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, edited, reopened]
  workflow_dispatch:

jobs:
  verify-backend-deploy:
    # Pass 38 DEPLOY-4 — fail-fast on deploy mismatch. Post-merge only.
    # PR-time check is the screenshot job below.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Pass 45 T7b — must exceed DEPLOY_WAIT_S (20 min) plus checkout.
    timeout-minutes: 25
    steps:
      - name: Check out merged code
        uses: actions/checkout@v4

      - name: Capture expected SHA + pass
        id: expected
        run: |
          # The merge commit SHA on main. Production /version should
          # report exactly this. github.sha on push events points
          # exactly at the merged-into-main commit.
          EXPECTED_SHA="${{ github.sha }}"
          # Pass 37 A0.0 added `pass: <N>` to src/app.js. Grep + sed.
          # Fall back to 0 (always mismatches) so a missing/malformed
          # line is loud rather than silent.
          PASS=$(grep -E "^\s*pass:\s*[0-9]+," src/app.js | head -1 | sed -E 's/[^0-9]//g')
          if [ -z "$PASS" ]; then
            echo "::error::Could not parse pass number from src/app.js"
            exit 1
          fi
          echo "sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "pass=$PASS"        >> "$GITHUB_OUTPUT"
          echo "Expecting: sha=$EXPECTED_SHA, pass=$PASS"

      - name: Poll /version until deploy propagates
        env:
          EXPECTED_SHA:  ${{ steps.expected.outputs.sha }}
          EXPECTED_PASS: ${{ steps.expected.outputs.pass }}
          VERSION_URL:   ${{ secrets.PROD_VERSION_URL || 'https://vettit-backend-production.up.railway.app/version' }}
          # Pass 45 T7b — Railway's real deploy latency is 8-15 min
          # (observed across Passes 43-44); the old 5-min window
          # false-failed a healthy deploy. Poll up to 20 min.
          DEPLOY_WAIT_S: 1200
          POLL_EVERY_S: 30
        run: |
          set -euo pipefail
          elapsed=0
          last_resp=""
          while [ "$elapsed" -lt "$DEPLOY_WAIT_S" ]; do
            if response=$(curl -fsS --max-time 10 "$VERSION_URL" 2>/dev/null); then
              last_resp="$response"
              live_sha=$(echo "$response" | jq -r '.sha // empty')
              live_pass=$(echo "$response" | jq -r '.pass // empty')
              # Pass 38 DEPLOY-4 — Pass >= expected catches the case
              # where vettPass was bumped but Railway built an older
              # commit; SHA equality is the strict gate. Both must
              # hold for the deploy to be verified.
              if [ "$live_sha" = "$EXPECTED_SHA" ] \
                 && [ "$live_pass" -ge "$EXPECTED_PASS" ]; then
                echo "✅ Backend deploy verified."
                echo "    sha:  $live_sha"
                echo "    pass: $live_pass"
                exit 0
              fi
              echo "Deploy still propagating: live sha=$live_sha pass=$live_pass, expected sha=$EXPECTED_SHA pass>=$EXPECTED_PASS (elapsed ${elapsed}s)"
            else
              echo "Could not reach $VERSION_URL — still waiting (elapsed ${elapsed}s)"
            fi
            sleep "$POLL_EVERY_S"
            elapsed=$((elapsed + POLL_EVERY_S))
          done
          echo "::error::Backend deploy did not propagate within ${DEPLOY_WAIT_S}s."
          echo "::error::Last observed /version response: ${last_resp:-<unreachable>}"
          echo "::error::Expected: sha=$EXPECTED_SHA, pass>=$EXPECTED_PASS"
          echo "::error::Doctrine #17: shipped means deployed. Manual fix:"
          echo "::error::  1. Railway dashboard -> vettit-backend service ->"
          echo "::error::     Deployments — confirm latest shows main + merge SHA"
          echo "::error::  2. If auto-deploy didn't fire: check Settings -> Service"
          echo "::error::     Source — main branch must be selected with auto-deploy on"
          echo "::error::  3. Manual fallback: cd backend repo && railway up"
          exit 1

  require-screenshot-in-pr:
    # Doctrine #19: a PR must SHOW the page, not mention it.
    #
    # Ported from vett-platform#161. The previous version tested the body
    # against /screenshot/i, so the word alone passed and "Screenshot: not
    # applicable" was green. In the website repo that is how the change which
    # blanked every Creative Attention report reached production.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description for screenshot link
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            const body = pr.body || '';

            // Why this is stricter than "does the word appear".
            //
            // The first pattern used to be /screenshot/i, so the WORD passed.
            // #156 said "Screenshot: ... I cannot screenshot the authenticated
            // results page" and sailed through; it was the change that left
            // every Creative Attention report blank in production for a day.
            // #157 said "Screenshot: not applicable". Both were green.
            const excuses = [
              /screenshots?\s*[:\-]?\s*(not applicable|n\/?a\b|none|skipped|tbd)/i,
              /(cannot|can't|could not|couldn't|unable to)\s+screenshot/i,
              /no screenshots?\s+(needed|required|possible)/i,
            ];
            // Quoting an excuse is not making one. A post-mortem that cites
            // "Screenshot: not applicable" to explain why this check changed
            // must not be blocked by its own example, so fenced code, inline
            // code and blockquotes are stripped before the excuse scan.
            const prose = body
              .replace(/```[\s\S]*?```/g, ' ')
              .replace(/`[^`\n]*`/g, ' ')
              .split('\n').filter((l) => !/^\s*>/.test(l)).join('\n');

            const excuse = excuses.find((re) => re.test(prose));
            if (excuse) {
              core.setFailed(
                'Doctrine #19 - this PR explains why it has no screenshot. ' +
                'That is the failure mode this check exists to stop: a change ' +
                'can pass every data check and still render a blank page. ' +
                'Open the page and say what you saw.'
              );
              return;
            }

            // An image, where one can be published.
            const imageHosts = [
              /prnt\.sc/i, /imgur\.com/i, /cleanshot\.com/i, /d\.pr\//i,
              /dropbox\.com/i, /github\.com\/.*\.(png|jpg|jpeg)/i,
              /user-images\.githubusercontent\.com/i,
              /private-user-images\.githubusercontent\.com/i,
              /!\[[^\]]*\]\([^)]+\)/,
            ];
            const hasImage = imageHosts.some((re) => re.test(body));

            // This repository is PUBLIC, so a signed-in page must not be
            // screenshotted into it - that would republish the customer content
            // the app takes care to keep private. For those, the evidence is a
            // named URL plus what was on it, handed over out of band.
            const hasUrl = /https:\/\/(www\.)?vettit\.ai\/\S+/i.test(body);
            const hasLooked = /^\s*(looked at|verified on|evidence)\s*:/im.test(body);

            if (hasImage || (hasUrl && hasLooked)) {
              core.info(
                hasImage
                  ? '✅ Screenshot image found in the PR description.'
                  : '✅ Named production URL plus an Evidence/Looked at line.'
              );
            } else {
              core.setFailed(
                'Doctrine #19 - a PR must show the page, not mention it. Either:\n' +
                '  (a) embed a screenshot image, or\n' +
                '  (b) for a signed-in page (this repo is public, so do not post ' +
                'customer content here): give the https://www.vettit.ai/... URL ' +
                'you opened AND a line starting "Looked at:" or "Evidence:" ' +
                'saying what rendered.'
              );
            }

  # ─────────────────────────────────────────────────────────────────────
  # The test suite, on every pull request and every push to main.
  #
  # 2026-09-20: until today NOTHING ran the tests in CI. The only checks
  # were this file's deploy verification, the screenshot rule and secret
  # scanning, so a change could reach production with a red suite as long
  # as nobody ran `npm test` locally first. The panel-collapse defect
  # (one respondent repeated across a whole paid study, live from 12 June
  # to 19 September) is what that gap cost: 17 of 32 delivered studies.
  #
  # The suite includes the guards that defect needed:
  #   - test/panel_distinctness.test.js       panels are different people
  #   - test/panel_collapse_fails_mission.test.js  a collapsed panel never ships
  #   - test/panel_guards_wired.test.js       the guards stay wired in
  # ─────────────────────────────────────────────────────────────────────
  tests:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: npm test
        run: npm test
